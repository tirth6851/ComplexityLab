        - generic [ref=e23]:
          - heading "What we collect" [level=2] [ref=e24]
          - generic [ref=e25]:
            - paragraph [ref=e26]:
              - strong [ref=e27]: Account data.
              - text: Sign-in is handled by Clerk using Google. We receive your name, email address, and profile picture from your Google account. We never see or store a password.
            - paragraph [ref=e28]:
              - strong [ref=e29]: Content you create.
              - text: Code you submit to the analyzer is processed to produce a complexity result. It is stored only when you explicitly save an analysis or a snippet; otherwise it is discarded after the analysis completes. Saved analyses and snippets are private to your account.
            - paragraph [ref=e30]:
              - strong [ref=e31]: Profile settings.
              - text: An optional display name and a preferred programming language.
            - paragraph [ref=e32]:
              - strong [ref=e33]: Technical data.
              - text: Server logs for security and reliability (timestamps, account identifier, selected language, code size, result class, durations, and rate-limit events). We do not log the content of your code.
        - generic [ref=e34]:
          - heading "How we use it" [level=2] [ref=e35]
          - generic [ref=e36]:
            - paragraph [ref=e37]: To operate the product (run analyses, store what you save, show your dashboard), to keep the service secure (authentication, rate limiting, abuse prevention), and to fix problems (error logs). We do not sell your data and we do not use it for advertising.
            - paragraph [ref=e38]: When AI-assisted analysis is enabled, the code you submit is sent to our AI inference provider (Groq, Inc.) solely to produce your analysis result.
        - generic [ref=e39]:
          - heading "Cookies" [level=2] [ref=e40]
          - generic [ref=e41]:
            - paragraph [ref=e42]: "We use a small set of strictly functional cookies:"
            - list [ref=e43]:
              - listitem [ref=e44]: __session and related Clerk cookies — keep you signed in (essential).
              - listitem [ref=e45]: cl-consent — remembers that you accepted this policy (essential).
              - listitem [ref=e46]: theme (localStorage) — remembers your light/dark preference.
            - paragraph [ref=e47]: We do not use advertising or cross-site tracking cookies. Because the essential cookies are required for the service to function, you must accept them to use ComplexityLab.
        - generic [ref=e48]:
          - heading "Who processes your data" [level=2] [ref=e49]
          - generic [ref=e50]:
            - paragraph [ref=e51]: "We rely on these service providers, each receiving only what they need to perform their function:"
            - list [ref=e52]:
              - listitem [ref=e53]: Clerk (authentication and session management)
              - listitem [ref=e54]: Google (sign-in identity provider)
              - listitem [ref=e55]: Supabase (database hosting for your saved content)
              - listitem [ref=e56]: Vercel (application hosting and logs)
              - listitem [ref=e57]: Groq (AI inference, only when AI analysis is enabled)
        - generic [ref=e58]:
          - heading "Retention and deletion" [level=2] [ref=e59]
          - paragraph [ref=e61]:
            - text: Saved analyses and snippets are kept until you delete them. You can delete individual items from their pages, or remove
            - emphasis [ref=e62]: everything
            - text: at once from Settings → Account → Danger zone (“Delete all lab data”). Deleting your data there is immediate and irreversible. To remove your sign-in identity as well, contact us at tirth2093@gmail.comor remove the app’s access from your Google account.
        - generic [ref=e63]:
          - heading "Your rights" [level=2] [ref=e64]
          - paragraph [ref=e66]: Depending on where you live (e.g. GDPR in the EU/UK, CCPA in California), you may have rights to access, correct, export, or delete your personal data, and to object to or restrict certain processing. Exercise them via the in-app deletion tools or by emailing tirth2093@gmail.com. We respond within 30 days.
        - generic [ref=e67]:
          - heading "Security" [level=2] [ref=e68]
          - paragraph [ref=e70]: All traffic is encrypted in transit (HTTPS). Database access is restricted to server-side code with row-level security enabled, and privileged keys are never shipped to the browser. API endpoints are authenticated and rate-limited.
        - generic [ref=e71]:
          - heading "Children" [level=2] [ref=e72]
          - paragraph [ref=e74]: ComplexityLab is not directed at children under 13 (or the minimum age in your jurisdiction), and we do not knowingly collect their data. If you believe a child has used the service, contact us and we will delete the data.
        - generic [ref=e75]:
          - heading "Changes" [level=2] [ref=e76]
          - paragraph [ref=e78]: If we materially change this policy, we will update the effective date above and ask for your consent again on your next visit.
