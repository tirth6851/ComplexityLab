<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" font-family="'JetBrains Mono', 'Fira Code', monospace">

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="#0d1117"/>

  <!-- Grid lines (subtle) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2236" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="860" height="480" fill="url(#grid)" rx="16" opacity="0.6"/>

  <!-- Title -->
  <text x="430" y="38" fill="#00e599" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3" filter="url(#glow)">LEETCODE INTELLIGENCE — RAG PIPELINE</text>
  <line x1="80" y1="50" x2="780" y2="50" stroke="#00e599" stroke-width="0.5" opacity="0.4"/>

  <!-- ── Row 1: Input nodes ── -->

  <!-- Box: User Code -->
  <rect x="40" y="76" width="160" height="60" rx="8" fill="#111927" stroke="#2a3a52" stroke-width="1.5"/>
  <text x="120" y="100" fill="#c9d4e8" font-size="11" font-weight="600" text-anchor="middle">USER CODE</text>
  <text x="120" y="118" fill="#5a6e8a" font-size="9" text-anchor="middle">POST /api/analyze</text>

  <!-- Arrow: User Code → Analyzer -->
  <line x1="200" y1="106" x2="270" y2="106" stroke="#2a3a52" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box: Analyzer (existing) -->
  <rect x="270" y="76" width="180" height="60" rx="8" fill="#0f1f14" stroke="#00e599" stroke-width="1.5"/>
  <text x="360" y="97" fill="#00e599" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">ANALYZER (EXISTING)</text>
  <text x="360" y="112" fill="#4a7c59" font-size="9" text-anchor="middle">Heuristic engine</text>
  <text x="360" y="124" fill="#4a7c59" font-size="9" text-anchor="middle">+ Groq llama-3.3-70b</text>

  <!-- Arrow: Analyzer → CodeAnalysis -->
  <line x1="450" y1="106" x2="520" y2="106" stroke="#2a3a52" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box: CodeAnalysis -->
  <rect x="520" y="76" width="160" height="60" rx="8" fill="#111927" stroke="#2a3a52" stroke-width="1.5"/>
  <text x="600" y="100" fill="#c9d4e8" font-size="11" font-weight="600" text-anchor="middle">CODE ANALYSIS</text>
  <text x="600" y="118" fill="#5a6e8a" font-size="9" text-anchor="middle">time · space · notes</text>

  <!-- Label: unchanged -->
  <text x="360" y="66" fill="#00e599" font-size="8" text-anchor="middle" opacity="0.7">UNCHANGED BEHAVIOR →</text>

  <!-- Arrow: CodeAnalysis right → Client -->
  <line x1="680" y1="106" x2="740" y2="106" stroke="#2a3a52" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="740" y="84" width="78" height="44" rx="6" fill="#111927" stroke="#2a3a52" stroke-width="1"/>
  <text x="779" y="104" fill="#5a6e8a" font-size="9" text-anchor="middle">CLIENT</text>
  <text x="779" y="116" fill="#5a6e8a" font-size="9" text-anchor="middle">renders UI</text>

  <!-- ── Divider ── -->
  <line x1="80" y1="162" x2="780" y2="162" stroke="#1a2236" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="430" y="175" fill="#2a3a52" font-size="8" text-anchor="middle" letter-spacing="2">NEW RAG BRANCH (PARALLEL — AFTER ANALYSIS RETURNS)</text>

  <!-- ── Row 2: Embed → Retrieve ── -->

  <!-- Arrow: CodeAnalysis → Embed (down) -->
  <line x1="600" y1="136" x2="600" y2="182" stroke="#2a3a52" stroke-width="1.5"/>
  <line x1="600" y1="182" x2="270" y2="182" stroke="#2a3a52" stroke-width="1.5"/>
  <line x1="270" y1="182" x2="270" y2="204" stroke="#2a3a52" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="435" y="178" fill="#2a3a52" font-size="8" text-anchor="middle">build query: code + notes + complexity</text>

  <!-- Box: Embed Provider -->
  <rect x="160" y="204" width="220" height="64" rx="8" fill="#171220" stroke="#6c3d9e" stroke-width="1.5"/>
  <text x="270" y="226" fill="#b48ae8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">EMBED PROVIDER</text>
  <text x="270" y="242" fill="#6c3d9e" font-size="9" text-anchor="middle">OpenAI text-embedding-3-small</text>
  <text x="270" y="255" fill="#6c3d9e" font-size="9" text-anchor="middle">768-dim vector (float32)</text>

  <!-- Arrow: Embed → pgvector -->
  <line x1="380" y1="236" x2="456" y2="236" stroke="#6c3d9e" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Box: pgvector -->
  <rect x="456" y="204" width="220" height="64" rx="8" fill="#111520" stroke="#3d6ab4" stroke-width="1.5"/>
  <text x="566" y="226" fill="#7ab0f5" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">PGVECTOR SEARCH</text>
  <text x="566" y="242" fill="#3d6ab4" font-size="9" text-anchor="middle">cosine similarity · ivfflat index</text>
  <text x="566" y="255" fill="#3d6ab4" font-size="9" text-anchor="middle">lc_problems (150 problems)</text>

  <!-- ── Row 3: Results ── -->

  <!-- Arrow: pgvector → Problem Matches -->
  <line x1="566" y1="268" x2="566" y2="310" stroke="#3d6ab4" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="600" y="294" fill="#2a3a52" font-size="8">TOP-5</text>

  <!-- Arrow: Embed → Problem Matches (down from embed) -->
  <line x1="270" y1="268" x2="270" y2="310" stroke="#6c3d9e" stroke-width="1.5"/>
  <line x1="270" y1="310" x2="380" y2="310" stroke="#3d6ab4" stroke-width="1.5"/>

  <!-- Box: Problem Matches -->
  <rect x="380" y="310" width="220" height="64" rx="8" fill="#0f1f14" stroke="#00e599" stroke-width="1.5"/>
  <text x="490" y="332" fill="#00e599" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">PROBLEM MATCHES</text>
  <text x="490" y="348" fill="#4a7c59" font-size="9" text-anchor="middle">title · difficulty · patterns</text>
  <text x="490" y="361" fill="#4a7c59" font-size="9" text-anchor="middle">hint_0 · similarity_score</text>

  <!-- Arrow: Problem Matches → Chat -->
  <line x1="490" y1="374" x2="490" y2="410" stroke="#00e599" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- Box: Chat -->
  <rect x="340" y="410" width="300" height="52" rx="8" fill="#0f1f14" stroke="#00e599" stroke-width="1.5"/>
  <text x="490" y="432" fill="#00e599" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">/chat — ENRICHED PROMPT</text>
  <text x="490" y="448" fill="#4a7c59" font-size="9" text-anchor="middle">contextRef → problem + analysis anchor → Groq</text>

  <!-- POST label -->
  <text x="490" y="402" fill="#5a6e8a" font-size="8" text-anchor="middle">POST /api/problems/similar  →  optional "Discuss" → /chat</text>

  <!-- Side: Problem Bank -->
  <rect x="680" y="310" width="140" height="64" rx="8" fill="#111927" stroke="#2a3a52" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="750" y="332" fill="#5a6e8a" font-size="9" font-weight="700" text-anchor="middle">PROBLEM BANK</text>
  <text x="750" y="348" fill="#2a3a52" font-size="8" text-anchor="middle">~150 original problems</text>
  <text x="750" y="360" fill="#2a3a52" font-size="8" text-anchor="middle">14 patterns (CC-clean)</text>
  <line x1="680" y1="342" x2="600" y2="342" stroke="#2a3a52" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Side: User Attempts -->
  <rect x="40" y="310" width="140" height="64" rx="8" fill="#111927" stroke="#2a3a52" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="110" y="332" fill="#5a6e8a" font-size="9" font-weight="700" text-anchor="middle">USER ATTEMPTS</text>
  <text x="110" y="348" fill="#2a3a52" font-size="8" text-anchor="middle">per-user history</text>
  <text x="110" y="360" fill="#2a3a52" font-size="8" text-anchor="middle">weak-topic tracking</text>
  <line x1="380" y1="342" x2="180" y2="342" stroke="#2a3a52" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="40" y="422" width="280" height="46" rx="6" fill="#0a0f1a" stroke="#1a2236" stroke-width="1"/>
  <text x="56" y="440" fill="#5a6e8a" font-size="8" font-weight="700" letter-spacing="1">LEGEND</text>
  <rect x="56" y="448" width="10" height="8" rx="2" fill="#0f1f14" stroke="#00e599" stroke-width="1.5"/>
  <text x="72" y="456" fill="#5a6e8a" font-size="8">Existing / extended</text>
  <rect x="140" y="448" width="10" height="8" rx="2" fill="#111927" stroke="#2a3a52" stroke-width="1.5"/>
  <text x="156" y="456" fill="#5a6e8a" font-size="8">New (solid)</text>
  <rect x="210" y="448" width="10" height="8" rx="2" fill="#111927" stroke="#2a3a52" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="226" y="456" fill="#5a6e8a" font-size="8">Static / data</text>

  <!-- Arrowhead defs -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a3a52"/>
    </marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6c3d9e"/>
    </marker>
    <marker id="arr3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3d6ab4"/>
    </marker>
    <marker id="arr4" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00e599"/>
    </marker>
  </defs>

</svg>
